<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">HYDRA: one serving setup, three network fidelity levels</title>
  <desc id="description">HYDRA selects an analytic, aggregate packet, or CHIPSIM/Garnet network executor through its backend factory. HYDRA owns hardware, workload, task mapping, batching, shared compute profiles and compute/network coordination. Network completion events return to the same serving runtime, which reports serving metrics such as throughput and TTFT alongside simulation cost.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536477"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #203044; }
      .small { font-size: 15px; }
      .body { font-size: 17px; }
      .name { font-size: 30px; font-weight: bold; }
      .wire { fill: none; stroke: #536477; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1200" height="650" rx="12" fill="white"/>
  <!-- Shared ownership and selection; the tiers are alternative executors. -->
  <rect x="100" y="28" width="1050" height="82" rx="10" fill="#F2F5F8" stroke="#CBD5DF"/>
  <text x="625" y="59" text-anchor="middle" font-size="23" font-weight="bold">HYDRA owns the serving setup</text>
  <text x="625" y="87" text-anchor="middle" class="body">HW + workload + task mapping / batching + shared compute profiles</text>
  <path class="wire" d="M625 110 V150 M250 150 H990 M250 150 V178 M620 150 V178 M990 150 V178"/>
  <rect x="428" y="127" width="384" height="28" fill="white"/>
  <text x="620" y="147" text-anchor="middle" class="body">Select a backend for a design point</text>

  <!-- Analytic: one timed transfer with no explicit packet queue. -->
  <rect x="90" y="180" width="320" height="315" rx="12" fill="#F3F9FD" stroke="#0072B2" stroke-width="2"/>
  <text x="112" y="216" class="name" style="fill:#0072B2">Low fidelity</text>
  <text x="112" y="246" class="body">HYDRA-Analytic</text>
  <rect x="117" y="281" width="69" height="47" rx="5" fill="white" stroke="#0072B2"/>
  <text x="151" y="310" text-anchor="middle" class="small">HBM</text>
  <path d="M191 304 H305" stroke="#0072B2" stroke-width="3"/>
  <text x="248" y="292" text-anchor="middle" class="small">bytes / BW</text>
  <rect x="311" y="281" width="75" height="47" rx="5" fill="white" stroke="#0072B2"/>
  <text x="348" y="310" text-anchor="middle" class="small">Compute</text>
  <text x="112" y="380" class="body">Analytical transfer timing</text>
  <text x="112" y="406" class="body">HYDRA bandwidth reservations</text>
  <path d="M112 429 H388" stroke="#C7DEEC"/>
  <text x="112" y="454" class="small">Quick evaluation of many designs</text>
  <text x="112" y="478" class="small" style="fill:#0072B2">hydra_sim</text>

  <!-- Medium: aggregate packets traversing directed mesh queues. -->
  <rect x="460" y="180" width="320" height="315" rx="12" fill="#FFF8F2" stroke="#D55E00" stroke-width="2"/>
  <text x="482" y="216" class="name" style="fill:#B34F00">Medium fidelity</text>
  <text x="482" y="246" class="body">HYDRA-Packet</text>
  <path d="M507 279 H620 H733 M507 337 H620 H733 M507 279 V337 M620 279 V337 M733 279 V337" stroke="#D8AB89" stroke-width="3" fill="none"/>
  <g fill="white" stroke="#D55E00" stroke-width="2">
    <rect x="497" y="269" width="20" height="20" rx="3"/><rect x="610" y="269" width="20" height="20" rx="3"/><rect x="723" y="269" width="20" height="20" rx="3"/>
    <rect x="497" y="327" width="20" height="20" rx="3"/><rect x="610" y="327" width="20" height="20" rx="3"/><rect x="723" y="327" width="20" height="20" rx="3"/>
  </g>
  <g fill="#D55E00"><rect x="529" y="272" width="27" height="14" rx="2"/><rect x="562" y="272" width="27" height="14" rx="2"/><rect x="613" y="300" width="14" height="21" rx="2"/><rect x="657" y="330" width="27" height="14" rx="2"/></g>
  <text x="482" y="380" class="body">C++ aggregate packet events</text>
  <text x="482" y="406" class="body">Queues, contention, backpressure</text>
  <path d="M482 429 H758" stroke="#ECD4C1"/>
  <text x="482" y="454" class="small">Refine selected designs</text>
  <text x="482" y="478" class="small" style="fill:#B34F00">hydra_packet</text>

  <!-- High: a router inset with flits, virtual channels and credit return. -->
  <rect x="830" y="180" width="320" height="315" rx="12" fill="#F5F6F8" stroke="#252525" stroke-width="2"/>
  <text x="852" y="216" class="name">High fidelity</text>
  <text x="852" y="246" class="body">CHIPSIM/Garnet</text>
  <rect x="897" y="262" width="206" height="82" rx="6" fill="white" stroke="#84909E"/>
  <g fill="#536477">
    <rect x="909" y="274" width="10" height="12"/><rect x="923" y="274" width="10" height="12"/><rect x="937" y="274" width="10" height="12"/><rect x="951" y="274" width="10" height="12"/>
    <rect x="909" y="296" width="10" height="12"/><rect x="923" y="296" width="10" height="12"/>
    <rect x="909" y="318" width="10" height="12"/><rect x="923" y="318" width="10" height="12"/><rect x="937" y="318" width="10" height="12"/>
  </g>
  <text x="887" y="307" text-anchor="end" class="small">VCs</text>
  <path class="wire" d="M967 280 H989 V302 H1012 M967 302 H1012 M967 324 H989 V302"/>
  <rect x="1016" y="279" width="76" height="46" rx="4" fill="#E8EDF2"/>
  <text x="1054" y="299" text-anchor="middle" class="small">Switch /</text>
  <text x="1054" y="316" text-anchor="middle" class="small">link</text>
  <path class="wire" d="M1103 302 H1132" marker-end="url(#arrow)"/>
  <text x="990" y="362" text-anchor="middle" font-size="13">Flits advance; credits return</text>
  <text x="852" y="389" class="body">Persistent Garnet network</text>
  <text x="852" y="414" class="body">Flits, VCs, buffer credits</text>
  <path d="M852 429 H1128" stroke="#D5D9E0"/>
  <text x="852" y="454" class="small">Detailed validation on demand</text>
  <text x="852" y="478" class="small">chipsim_contended</text>

  <!-- Completions wake the same serving runtime, closing the loop. -->
  <path class="wire" d="M250 495 V530 H990 V495 M620 495 V530 M620 530 V566" marker-end="url(#arrow)"/>
  <path class="wire" d="M250 530 H40 V69 H98" marker-end="url(#arrow)"/>
  <rect x="416" y="518" width="408" height="26" fill="white"/>
  <text x="620" y="537" text-anchor="middle" class="body">Completion events wake HYDRA runtime</text>
  <rect x="210" y="568" width="820" height="52" rx="9" fill="#F2F5F8" stroke="#CBD5DF"/>
  <text x="620" y="600" text-anchor="middle" class="body">Serving metrics (TP / TTFT)     |     Simulation cost (wall time)</text>
  <text x="620" y="641" text-anchor="middle" class="small">Select network fidelity to balance detail and simulation cost.</text>
</svg>
